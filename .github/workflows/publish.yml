name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled

permissions: {}

concurrency:
  group: bottle-publishing
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      packages: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1

      - name: Make release bottle uploads safe to retry
        run: |
          python3 - "$(brew --repository)/Library/Homebrew/github_releases.rb" <<'PYTHON'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          original = '        GitHub.upload_release_asset user, repo, release["id"], local_file:, remote_file:'
          replacement = '''        asset = release.fetch("assets").find { |entry| entry.fetch("name") == remote_file }
                  if asset
                    digest = "sha256:#{Digest::SHA256.file(local_file).hexdigest}"
                    unless asset["state"] == "uploaded" && asset["digest"] == digest
                      odie "Existing release asset #{remote_file} does not match the bottle being published"
                    end
                    ohai "Reusing verified release asset #{remote_file}"
                    next
                  end
                  GitHub.upload_release_asset user, repo, release["id"], local_file:, remote_file:'''
          if source.count(original) != 1:
              raise SystemExit("Homebrew release uploader changed; refusing to patch")
          source = source.replace('require "json"', 'require "json"\nrequire "digest"', 1)
          path.write_text(source.replace(original, replacement, 1))
          PYTHON

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ github.token }}
          branch: main

      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"
